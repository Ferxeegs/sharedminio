services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sharedminio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - ${MINIO_DATA_PATH}:/data
    networks:
      - app-bridge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # S3 API :9000 for apps. Console :9001 for admin (restrict via host firewall / VPN).
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: sharedminio-minio-init
    depends_on:
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./scripts:/scripts:ro
      - ./policies:/policies:ro
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    networks:
      - app-bridge
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: sharedminio-prometheus
    depends_on:
      - minio
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-bridge
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: sharedminio-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - app-bridge
    restart: unless-stopped

networks:
  app-bridge:
    name: app-bridge
    external: true

volumes:
  prometheus-data:
  grafana-data:
